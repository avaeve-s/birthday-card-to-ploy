<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Ploy 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mali:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffe0ec;
    --pink-deep:#ffc2d9;
    --pink-hot:#ff8fb3;
    --yellow:#fff4c9;
    --yellow-deep:#ffe89a;
    --cream:#fffaf3;
    --ink:#6b4c57;
    --ink-soft:#9a7683;
    --purple:#a97ea8;
    --white:#fffdf9;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0; min-height:100vh;
    font-family:'Mali', sans-serif;
    overflow-x:hidden;
  }

  body{
    background:
      radial-gradient(ellipse at 15% 10%, var(--yellow) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 20%, var(--pink-deep) 0%, transparent 45%),
      radial-gradient(ellipse at 20% 90%, var(--pink) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 85%, var(--yellow-deep) 0%, transparent 45%),
      linear-gradient(160deg, #fff6ea 0%, #ffeef4 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
  }

  /* ---------- floating cute decorations ---------- */
  .deco-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .deco{
    position:absolute;
    font-size:34px;
    filter:drop-shadow(0 4px 6px rgba(169,126,168,0.18));
    animation:floaty 5s ease-in-out infinite;
    opacity:.9;
  }
  .deco.d1{ top:6%; left:6%; font-size:38px; animation-delay:0s; }
  .deco.d2{ top:10%; right:8%; font-size:30px; animation-delay:.6s; }
  .deco.d3{ bottom:10%; left:9%; font-size:34px; animation-delay:1.1s; }
  .deco.d4{ bottom:7%; right:7%; font-size:40px; animation-delay:.3s; }
  .deco.d5{ top:42%; left:3%; font-size:26px; animation-delay:1.5s; }
  .deco.d6{ top:38%; right:3%; font-size:28px; animation-delay:.9s; }
  .deco.d7{ top:2%; left:42%; font-size:24px; animation-delay:1.8s; }
  .deco.d8{ bottom:3%; left:44%; font-size:26px; animation-delay:.5s; }

  @keyframes floaty{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-14px) rotate(4deg); }
  }

  @media (max-width:560px){
    .deco{ display:none; }
    .deco.d1,.deco.d2,.deco.d3,.deco.d4{ display:block; font-size:24px; }
  }

  /* ---------- ENVELOPE ---------- */
  .stage{
    width:100%;
    max-width:460px;
    position:relative;
    z-index:2;
  }

  .envelope-wrap{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    cursor:pointer;
    user-select:none;
    transition:opacity .55s ease .15s, transform .55s ease .15s;
  }
  .envelope-wrap.opened{
    opacity:0;
    pointer-events:none;
    transform:scale(.9);
  }

  .envelope{
    position:absolute; inset:0;
    background:linear-gradient(150deg, var(--white), var(--pink) 70%);
    border-radius:26px;
    box-shadow:0 20px 40px rgba(255,143,179,0.3), inset 0 0 0 3px rgba(255,255,255,0.6);
    overflow:hidden;
  }

  .flap{
    position:absolute; top:0; left:0; right:0;
    height:60%;
    background:linear-gradient(155deg, var(--yellow-deep), var(--pink-deep));
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transition:transform .85s cubic-bezier(.6,-0.2,.3,1.3);
    z-index:5;
  }
  .envelope-wrap.opened .flap{ transform:rotateX(178deg); }

  .bow{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-42%);
    font-size:46px;
    z-index:6;
    filter:drop-shadow(0 4px 8px rgba(169,126,168,0.35));
    transition:transform .5s ease, opacity .4s ease;
  }
  .envelope-wrap.opened .bow{
    transform:translate(-50%,-42%) scale(0) rotate(45deg);
    opacity:0;
  }

  .env-deco{
    position:absolute;
    font-size:22px;
    z-index:4;
    opacity:.85;
  }
  .env-deco.e1{ top:12px; left:16px; }
  .env-deco.e2{ bottom:14px; right:18px; }
  .env-deco.e3{ bottom:16px; left:14px; font-size:18px; }

  .env-front-text{
    position:absolute;
    bottom:13%;
    left:0; right:0;
    text-align:center;
    z-index:3;
    padding:0 16px;
  }
  .env-front-text .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--ink);
    font-size:clamp(20px,6vw,28px);
    margin:0;
  }
  .env-front-text .to{
    font-family:'Mali', sans-serif;
    color:var(--purple);
    font-size:14.5px;
    margin-top:4px;
  }

  .hint{
    position:absolute;
    bottom:-40px;
    left:0; right:0;
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(-3px); }
  }

  /* ---------- LETTER ---------- */
  .letter-wrap{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:44px 18px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    opacity:0;
    pointer-events:none;
    transition:opacity .6s ease;
    z-index:10;
  }
  .letter-wrap.show{
    opacity:1;
    pointer-events:auto;
  }

  .letter{
    position:relative;
    max-width:480px;
    width:100%;
    margin:auto 0;
    background:linear-gradient(180deg, var(--white), var(--pink) 130%);
    border-radius:32px;
    padding:40px 30px 34px;
    box-shadow:0 25px 55px rgba(255,143,179,0.35), inset 0 0 0 3px rgba(255,255,255,0.7);
    border:3px dashed var(--pink-deep);
    transform:translateY(40px) scale(.94);
    opacity:0;
    transition:transform .75s cubic-bezier(.2,.9,.3,1.1), opacity .6s ease;
  }
  .letter-wrap.show .letter{
    transform:translateY(0) scale(1);
    opacity:1;
  }

  .corner-deco{
    position:absolute;
    font-size:30px;
    z-index:2;
    filter:drop-shadow(0 3px 5px rgba(169,126,168,0.25));
  }
  .corner-deco.c1{ top:-16px; left:-12px; transform:rotate(-15deg); }
  .corner-deco.c2{ top:-18px; right:-10px; transform:rotate(18deg); font-size:26px; }
  .corner-deco.c3{ bottom:-14px; left:-8px; transform:rotate(10deg); font-size:24px; }
  .corner-deco.c4{ bottom:-16px; right:-14px; transform:rotate(-12deg); font-size:28px; }

  .music-btn{
    position:absolute;
    top:14px; right:14px;
    width:36px; height:36px;
    border-radius:50%;
    border:2px solid var(--pink-deep);
    background:var(--white);
    color:var(--pink-hot);
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
    transition:transform .2s ease;
  }
  .music-btn:active{ transform:scale(.9); }

  .letter-header{
    text-align:center;
    margin-bottom:16px;
  }
  .letter-header .emoji-row{
    font-size:26px;
    display:block;
    margin-bottom:6px;
  }
  .letter-header h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    color:var(--ink);
    font-size:24px;
    margin:0;
  }

  .divider{
    text-align:center;
    color:var(--pink-hot);
    font-size:16px;
    margin:12px 0 20px;
    letter-spacing:6px;
  }

  .photo-frame{
    display:flex;
    justify-content:center;
    margin:0 0 22px;
  }
  .polaroid{
    background:var(--white);
    padding:10px 10px 34px;
    border-radius:14px;
    box-shadow:0 12px 24px rgba(255,143,179,0.3);
    width:180px;
    position:relative;
    transform:rotate(-3deg) translateY(20px);
    opacity:0;
    transition:opacity .7s ease, transform .7s ease;
    transition-delay:.3s;
  }
  .letter-wrap.show .polaroid{
    opacity:1;
    transform:rotate(-3deg) translateY(0);
  }
  .polaroid img{
    display:block;
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
  }
  .polaroid .tape{
    position:absolute;
    top:-12px; left:50%;
    transform:translateX(-50%) rotate(-4deg);
    width:56px; height:22px;
    background:rgba(255,232,154,0.75);
    border:1px solid rgba(255,255,255,0.5);
  }
  .polaroid .cap{
    position:absolute;
    bottom:9px; left:0; right:0;
    text-align:center;
    font-family:'Mali', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
  }

  .letter-body p{
    font-family:'Mali', sans-serif;
    font-size:17px;
    line-height:1.9;
    color:var(--ink);
    margin:0 0 14px;
    text-align:center;
  }
  .letter-body p.big{
    font-size:19px;
    font-weight:500;
  }

  .signature{
    margin-top:22px;
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    color:var(--pink-hot);
  }

  .close-btn{
    display:block;
    margin:26px auto 0;
    background:var(--pink-hot);
    border:none;
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-size:14px;
    padding:10px 26px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 8px 16px rgba(255,143,179,0.4);
    transition:transform .2s ease;
  }
  .close-btn:active{ transform:scale(.95); }

  canvas#confetti{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
  }

  @media (max-width:420px){
    .letter{ padding:34px 20px 28px; border-radius:24px; }
    .letter-body p{ font-size:16px; }
    .corner-deco{ font-size:22px; }
  }
</style>
</head>
<body>

<div class="deco-layer">
  <span class="deco d1">🌸</span>
  <span class="deco d2">🎀</span>
  <span class="deco d3">🧸</span>
  <span class="deco d4">🌷</span>
  <span class="deco d5">💗</span>
  <span class="deco d6">⭐</span>
  <span class="deco d7">🎈</span>
  <span class="deco d8">🐰</span>
</div>

<div class="stage">
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope">
      <span class="env-deco e1">🌷</span>
      <span class="env-deco e2">🌸</span>
      <span class="env-deco e3">✨</span>
      <div class="flap"></div>
      <div class="bow">🎀</div>
      <div class="env-front-text">
        <p class="title">Happy Birthday to Ploy</p>
        <p class="to">เปิดอ่านการ์ดจากใจได้เลยน้า 💌</p>
      </div>
    </div>
    <div class="hint">🎀 คลิกเพื่อเปิดการ์ด</div>
  </div>
</div>

<div class="letter-wrap" id="letterWrap">
  <div class="letter" id="letterPaper">
    <span class="corner-deco c1">🌸</span>
    <span class="corner-deco c2">🎀</span>
    <span class="corner-deco c3">🌷</span>
    <span class="corner-deco c4">🧸</span>
    <button class="music-btn" id="musicBtn" aria-label="เปิด/ปิดเพลง">♪</button>

    <div class="letter-header">
      <span class="emoji-row">🎂🎉</span>
      <h1>สุขสันต์วันเกิดน้า</h1>
    </div>
    <div class="divider">• ✿ •</div>

    <div class="photo-frame">
      <div class="polaroid">
        <div class="tape"></div>
        <img src="photo1.jpg" alt="รูปพลอย">
        <div class="cap">Ploy 🎀</div>
      </div>
    </div>

    <div class="letter-body">
      <p class="big">ขอให้พลอยมีความสุขมากๆๆ</p>
      <p>งานดี เงินดี รวยๆ 😆</p>
      <p>รอไปเที่ยวด้วยกันอีกก 🫶🏻</p>
    </div>

    <button class="close-btn" id="closeBtn">ปิดการ์ด 🎀</button>
  </div>
</div>

<canvas id="confetti"></canvas>

<audio id="bgm" src="music.mp3" loop preload="none"></audio>

<script>
  const envelopeWrap = document.getElementById('envelopeWrap');
  const letterWrap = document.getElementById('letterWrap');
  const closeBtn = document.getElementById('closeBtn');
  const musicBtn = document.getElementById('musicBtn');
  const bgm = document.getElementById('bgm');
  let opened = false;
  let musicOn = false;

  function openCard(){
    if(opened) return;
    opened = true;
    envelopeWrap.classList.add('opened');
    setTimeout(()=>{
      letterWrap.classList.add('show');
      burstConfetti();
    }, 500);
    bgm.volume = 0.5;
    bgm.play().then(()=>{ musicOn = true; updateMusicIcon(); }).catch(()=>{ musicOn = false; updateMusicIcon(); });
  }

  envelopeWrap.addEventListener('click', openCard);

  closeBtn.addEventListener('click', ()=>{
    letterWrap.classList.remove('show');
  });

  function updateMusicIcon(){
    musicBtn.textContent = musicOn ? '♪' : '✕';
    musicBtn.style.opacity = musicOn ? '1' : '.55';
  }

  musicBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(musicOn){
      bgm.pause();
      musicOn = false;
    } else {
      bgm.play().catch(()=>{});
      musicOn = true;
    }
    updateMusicIcon();
  });

  /* confetti - pastel palette */
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const colors = ['#ff8fb3','#ffc2d9','#ffe89a','#fff4c9','#a97ea8','#ffffff'];
  let particles = [];

  function burstConfetti(){
    particles = [];
    const count = 150;
    for(let i=0;i<count;i++){
      particles.push({
        x: canvas.width/2 + (Math.random()-0.5)*130,
        y: canvas.height*0.25,
        vx: (Math.random()-0.5)*9,
        vy: Math.random()*-9 - 4,
        size: Math.random()*7+4,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*360,
        vr: (Math.random()-0.5)*12,
        shape: Math.random()>0.55 ? 'rect' : 'circle',
        gravity: 0.22 + Math.random()*0.08,
        life: 0
      });
    }
    requestAnimationFrame(animateConfetti);
  }

  function animateConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    particles.forEach(p=>{
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.99;
      p.rot += p.vr;
      if(p.y < canvas.height + 20 && p.life < 260){
        alive = true;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot*Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, 1 - p.life/260);
        if(p.shape === 'rect'){
          ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
        } else {
          ctx.beginPath();
          ctx.arc(0,0,p.size/2,0,Math.PI*2);
          ctx.fill();
        }
        ctx.restore();
      }
    });
    if(alive){
      requestAnimationFrame(animateConfetti);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }
</script>

</body>
</html>
